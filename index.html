<!doctype html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <script>
    // Tema recordado entre sesiones; en la primera visita respeta el del sistema.
    // Va temprano, antes de pintar, para evitar el parpadeo de claro a oscuro.
    try { var _t = localStorage.getItem('odt:tema'); document.documentElement.dataset.theme = (_t === 'dark' || _t === 'light') ? _t : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); } catch (e) {}
  </script>
  <meta name="theme-color" content="#f6f5f1" />
  <link rel="icon" type="image/png" href="/brand/favicon-64.png" />
  <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="OdonTeck" />
  <meta name="description" content="Club OdonTeck: cursos odontológicos grabados, materiales clínicos, clases en vivo y certificados." />
  <title>OdonTeck Club</title>
  <link rel="canonical" href="https://www.odonteckconsulting.com/" />
  <!-- Previsualización al compartir el enlace (WhatsApp, redes). Imagen cuadrada del ícono de marca;
       para una tarjeta grande, deja un 1200×630 en /brand/social/og-club.jpg y cambia a summary_large_image. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="OdonTeck Club" />
  <meta property="og:locale" content="es_MX" />
  <meta property="og:url" content="https://www.odonteckconsulting.com/" />
  <meta property="og:title" content="OdonTeck Club · Formación odontológica continua" />
  <meta property="og:description" content="Cursos odontológicos grabados, materiales clínicos, clases en vivo y certificados con folio verificable." />
  <meta property="og:image" content="https://www.odonteckconsulting.com/brand/icon-512.png" />
  <meta property="og:image:width" content="512" />
  <meta property="og:image:height" content="512" />
  <meta property="og:image:alt" content="OdonTeck Club" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="OdonTeck Club · Formación odontológica continua" />
  <meta name="twitter:description" content="Cursos odontológicos grabados, materiales clínicos, clases en vivo y certificados con folio verificable." />
  <meta name="twitter:image" content="https://www.odonteckconsulting.com/brand/icon-512.png" />
  <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />
  <link rel="preconnect" href="https://securetoken.googleapis.com" crossorigin />
  <script defer src="https://assets.mediadelivery.net/playerjs/player-0.1.0.min.js"></script>
  <script>
    // El dominio público abre la nueva landing; las rutas hash conservan el club.
    if (!location.hash) location.replace('/landing/');
  </script>
</head>
<body>
  <div id="app"><div class="card card--pad row" role="status" style="justify-content:center;min-height:180px;margin:24px 16px"><span>Cargando…</span></div></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
